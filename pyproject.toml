[project]
name = "ghaw-relations"
version = "0.1.0"
description = "Relations between GitHub Agentic Workflows instruction files (GHAW-H dataset)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "jupyterlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghaw_relations"]
