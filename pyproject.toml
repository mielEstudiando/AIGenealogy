[project]
name = "ghaw-relations"
version = "0.1.0"
description = "Relations between GitHub Agentic Workflows instruction files (GHAW-H dataset)"
license = "CC0-1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "model2vec>=0.9.0",
    "pandas>=2.2",
    "py3langid>=0.4.0",
    "pyarrow>=17",
    "pyyaml>=6.0.3",
    "regex>=2026.9.29",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghaw_relations"]
